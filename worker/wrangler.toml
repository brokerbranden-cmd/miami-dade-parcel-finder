# Reference config (the Worker was deployed through the Cloudflare API; this is equivalent for `wrangler deploy`).
# Secrets are NOT stored here:  wrangler secret put BATCHDATA_API_KEY   and   wrangler secret put ACCESS_CODE
name = "parcel-skiptrace"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Private site: the same Worker answers under the Access-protected hostname, so a Cloudflare Access login replaces the access code there
routes = [ { pattern = "app.prop-hunters.com/skiptrace-api/*", zone_name = "prop-hunters.com" } ]

[vars]
ALLOWED_ORIGIN = "https://brokerbranden-cmd.github.io,https://app.prop-hunters.com"
# Cloudflare Access (Zero Trust team domain + the "Parcel Finder" application's AUD tag; both public identifiers, not secrets)
ACCESS_TEAM_DOMAIN = "prophunters.cloudflareaccess.com"
ACCESS_AUD = "72a000a8f09b8ac8534ae40ccec12b617d2474b67ad0be651b8f4417078cb868"
MAX_PER_REQUEST = "50"
DAILY_CAP = "500"

# BatchData key lives in KV (key 'batchdata_key'); falls back to the BATCHDATA_API_KEY secret
[[kv_namespaces]]
binding = "SK_KV"
id = "71a8b95c182c4b1782c850f34c7e4fcc"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

# [[migrations]] v1 (new_sqlite_classes Limiter) already applied on the live Worker; omitted so deploys do not re-apply it

# Optional real mailbox check for skip-traced emails (OFF: nothing below is set). To turn it on later:
#   EMAIL_VERIFY_PROVIDER = "quickemailverification"   (or "zerobounce")  as a plain var,
#   the API key as a secret (wrangler secret put EMAIL_VERIFY_API_KEY) or in KV key 'email_verify_key',
#   EMAIL_VERIFY_DAILY = "90"  (calls per New York day; QuickEmailVerification's free tier is 100/day)
